<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greyhound Cafe — Daily Sales Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#0d1117;--surf:#161b22;--card:#1c2230;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#e6edf3;--muted:#8b949e;
  --accent:#3b82f6;--acc2:#60a5fa;
  --green:#3fb950;--red:#f85149;--amber:#f59e0b;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* TOPBAR */
.topbar{background:var(--surf);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;gap:12px}
.tb-left{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.tb-title{font-size:13px;font-weight:600}
.tb-sub{font-size:11px;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.sdot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.sdot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stxt{font-size:11px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-g{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:var(--r);padding:5px 12px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .15s}
.btn-g:hover{border-color:var(--acc2);color:var(--acc2)}

/* PAGE */
.page{max-width:1280px;margin:0 auto;padding:20px 20px 60px}

/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbadge{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:20px}

/* HERO */
.hero{background:var(--card);border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:28px 32px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero-center{text-align:center;flex:1}
.hero-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hero-value{font-family:var(--mono);font-size:56px;font-weight:600;color:var(--acc2);letter-spacing:-2px;line-height:1}
.hero-sub{font-size:12px;color:var(--muted);margin-top:8px}
.hero-side{text-align:center;flex:0 0 160px}
.hero-side .hov{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--text)}
.hero-side .hol{font-size:11px;color:var(--muted);margin-top:2px}

/* GROUP CARDS */
.gcrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:900px){.gcrow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.gcrow{grid-template-columns:1fr}}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;transition:border-color .2s}
.gcard:hover{border-color:var(--border2)}
.gc-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.gc-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.gc-stores{font-size:10px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.gc-val{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text)}
.gc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.gc-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.gc-bar-fill{height:100%;border-radius:2px;transition:width .8s ease}

/* CHART */
.ccard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.cwrap{position:relative;width:100%}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{font-size:11px;font-weight:500;padding:4px 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .15s}
.tab:hover{color:var(--text)}
.tab.on{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:var(--acc2)}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.lsq{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* TABLE */
.tcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:8px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
th.r,td.r{text-align:right}
tbody tr{transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px}
tbody tr:last-child td{border-bottom:none}
.sname{font-weight:600}
.rank{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bw{display:flex;align-items:center;gap:6px}
.bt{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:2px;min-width:50px}
.bf{height:100%;border-radius:2px}
.bpct{font-size:10px;color:var(--muted);font-family:var(--mono);min-width:30px}
.grp-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;font-family:var(--mono);display:inline-block;margin-left:6px}

/* LOADING */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,17,23,.8);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spin{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* FOOTER */
.footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);flex-wrap:wrap;gap:8px}
.footer a{color:var(--muted);text-decoration:none}
.footer a:hover{color:var(--acc2)}
.errbanner{display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--red)}
.errbanner.show{display:block}
</style>
</head>
<body>

<div class="overlay" id="loader"><div class="spin"></div><div style="font-size:12px;color:var(--muted)">กำลังดึงข้อมูลจาก Google Sheet…</div></div>

<header class="topbar">
  <div class="tb-left">
    <div class="logo">GH</div>
    <div>
      <div class="tb-title">Greyhound Cafe · Daily Sales Report</div>
      <div class="tb-sub" id="drSub">—</div>
    </div>
  </div>
  <div class="tb-right">
    <span class="sdot" id="sdot"></span>
    <span class="stxt" id="stxt">ยังไม่ได้โหลด</span>
    <button class="btn" onclick="fetchData()">⟳ รีเฟรช</button>
    <button class="btn-g" onclick="loadDemo()">Demo</button>
  </div>
</header>

<main class="page">
  <div class="errbanner" id="errBanner"></div>

  <!-- HERO -->
  <div class="sh" style="margin-top:4px">
    <span class="sl">ภาพรวม</span>
    <span class="dbadge" id="drBadge">—</span>
  </div>
  <div class="hero">
    <div class="hero-side">
      <div class="hov" id="hOrders">—</div>
      <div class="hol">จำนวนออเดอร์</div>
    </div>
    <div class="hero-center">
      <div class="hero-label">ยอดขายหลัง VAT 7%</div>
      <div class="hero-value" id="heroVat">—</div>
      <div class="hero-sub" id="heroSub">—</div>
    </div>
    <div class="hero-side">
      <div class="hov" id="hAvg">—</div>
      <div class="hol">เฉลี่ย / ออเดอร์</div>
    </div>
  </div>

  <!-- GROUP CARDS -->
  <div class="sh">
    <span class="sl">ยอดขายตามกลุ่ม</span>
    <span class="dbadge" id="grpBadge">—</span>
  </div>
  <div class="gcrow" id="groupCards"></div>

  <!-- CHART -->
  <div class="ccard" style="margin-bottom:20px">
    <div class="tabs">
      <button class="tab on" onclick="switchTab('daily',this)">รายวัน</button>
      <button class="tab" onclick="switchTab('store',this)">ตามสาขา</button>
    </div>
    <div class="cwrap" id="mwrap" style="height:300px"><canvas id="mc" role="img" aria-label="กราฟยอดขาย"></canvas></div>
    <div class="leg" id="mleg"></div>
  </div>

  <!-- STORE TABLE -->
  <div class="sh">
    <span class="sl">ยอดขายตามสาขา</span>
    <span class="dbadge" id="stBadge">—</span>
  </div>
  <div class="tcard">
    <table>
      <thead>
        <tr>
          <th style="width:32px">#</th>
          <th>สาขา</th>
          <th>กลุ่ม</th>
          <th class="r">ยอดขาย (฿)</th>
          <th class="r">ออเดอร์</th>
          <th class="r">ชิ้น</th>
          <th class="r">เฉลี่ย/ออเดอร์</th>
          <th style="width:150px">สัดส่วน</th>
        </tr>
      </thead>
      <tbody id="stBody"></tbody>
    </table>
  </div>

  <div class="footer">
    <span>Greyhound Cafe · Daily Sales Report · <a href="https://github.com/GREYHOUND1980/Daily-Sales-Greyhound" target="_blank">GitHub</a></span>
    <span id="genTime">—</span>
  </div>
</main>

<script>
Chart.register(ChartDataLabels);

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhr_pqHyepHduFsM51eoL7ZpFUSwaEcmHAkdaneiQtL7yTBjOyThPtjgrMIsLyuowh/exec";

// ── GROUPS (CLP, CWD เพิ่มใน Shop) ──────────────────────────
const GROUPS = [
  { key:'shop',    name:'Shop',          color:'#3b82f6',
    stores:new Set(['CLD','SC1','GCW','MGB','SHS','SC2','SPM','GPG','SCS','EML','CWV','EMQ','PS1','CCL','MDP','PS4','SCP','PS7','PS2','PS3','CLP','CWD']) },
  { key:'online',  name:'Online',        color:'#10b981',
    stores:new Set(['MEC']) },
  { key:'tiktok',  name:'TikTok',        color:'#f59e0b',
    stores:new Set(['TTS']) },
  { key:'outside', name:'Outside Sales', color:'#a78bfa',
    stores:new Set(['OL01','OL02','OS04']) },
];
function getGroup(n){ for(const g of GROUPS) if(g.stores.has(n)) return g; return null; }

const $  = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('th-TH').format(Math.round(Math.abs(n)));
const fmtB = n => { const a=Math.abs(n),s=n<0?'-':''; return a>=1e6?s+(a/1e6).toFixed(2)+'M':a>=1e3?s+(a/1e3).toFixed(0)+'K':s+Math.round(a); };

// ── วันที่ค.ศ. ── format dd/MM/yyyy (CE)
function toCE(dateStr) {
  // รับ "dd/MM/YY" (พ.ศ. 2 หลัก) หรือ "d ส.ค." จาก Apps Script
  // ถ้าเป็น thai short month string → แปลงเอง
  return dateStr; // Apps Script จะส่งมาถูกแล้วหลังแก้ Code.gs
}

let mainChart=null, curTab='daily', curData=null;

// ── RENDER ───────────────────────────────────────────────────
function render(d) {
  curData = d;
  const dr = d.dateRange||'—';
  ['drSub','drBadge','grpBadge','stBadge'].forEach(id=>$(id).textContent=dr);
  $('genTime').textContent = 'สร้างเมื่อ '+(d.generated||'—');

  // Hero — แสดงเฉพาะ VAT value (จำนวนเต็ม)
  const net = d.net||0;
  const vat = Math.round(net/1.07);
  animTo('heroVat', 0, vat, v=>'฿'+fmt(Math.round(v)));
  animTo('hOrders', 0, d.orders||0, v=>Math.round(v).toLocaleString('th-TH'));
  animTo('hAvg',    0, d.avgPerOrder||0, v=>'฿'+fmtB(Math.round(v)));
  $('heroSub').textContent = `จากยอดสุทธิ ฿${fmt(net)}`;

  buildGroupCards(d.storeList||[]);
  buildMain(d);
  buildTable(d.storeList||[]);
}

function animTo(id,from,to,fmtFn,dur=900){
  const el=$(id),t0=performance.now();
  const go=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmtFn(from+(to-from)*e);if(p<1)requestAnimationFrame(go);};
  requestAnimationFrame(go);
}

// ── GROUP CARDS ──────────────────────────────────────────────
function buildGroupCards(storeList){
  const tot={},rec={};
  GROUPS.forEach(g=>{tot[g.key]=0;rec[g.key]=0;});
  let grand=0;
  storeList.forEach(s=>{const g=getGroup(s.name);if(g){tot[g.key]+=s.rev;rec[g.key]+=s.rec;}grand+=s.rev;});
  const c=$('groupCards'); c.innerHTML='';
  GROUPS.forEach(g=>{
    const rev=tot[g.key];
    const pct=grand>0?(rev/grand*100).toFixed(1):0;
    const names=[...g.stores].sort().join(', ');
    const d=document.createElement('div'); d.className='gcard';
    d.innerHTML=`
      <div class="gc-name"><span class="gc-dot" style="background:${g.color}"></span>${g.name}</div>
      <div class="gc-stores">${names}</div>
      <div class="gc-val">฿${fmt(rev)}</div>
      <div class="gc-sub">${rec[g.key].toLocaleString('th-TH')} ออเดอร์ · ${pct}% ของยอดรวม</div>
      <div class="gc-bar"><div class="gc-bar-fill" style="background:${g.color};width:${pct}%"></div></div>`;
    c.appendChild(d);
  });
}

// ── MAIN CHART ───────────────────────────────────────────────
function buildMain(d){
  if(mainChart){mainChart.destroy();mainChart=null;}
  const wrap=$('mwrap'),leg=$('mleg');
  leg.innerHTML='';

  if(curTab==='daily'){
    wrap.style.height='300px';
    leg.innerHTML=mkLeg([['#3b82f6','ยอดขาย (฿)'],['#f59e0b','ออเดอร์']]);
    mainChart=new Chart($('mc'),{
      type:'bar',
      data:{
        labels:d.daily.labels,
        datasets:[
          {label:'ยอดขาย',data:d.daily.revenue,backgroundColor:'#3b82f699',borderRadius:5,borderSkipped:'bottom',yAxisID:'y',
           datalabels:{anchor:'end',align:'end',color:'#e6edf3',font:{size:10,family:"'JetBrains Mono',monospace"},formatter:v=>'฿'+fmtB(v)}},
          {label:'ออเดอร์',data:d.daily.receipts,type:'line',borderColor:'#f59e0b',pointBackgroundColor:'#f59e0b',pointRadius:4,borderWidth:2,backgroundColor:'transparent',yAxisID:'y2',
           datalabels:{display:false}}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        layout:{padding:{top:28}},
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:c=>c.datasetIndex===0?'฿'+fmt(c.parsed.y):c.parsed.y+' ออเดอร์'}},
          datalabels:{}
        },
        scales:{
          x:{ticks:{color:'#8b949e',font:{size:11}},grid:{display:false},border:{display:false}},
          y:{ticks:{color:'#8b949e',font:{size:11},callback:v=>'฿'+fmtB(v)},grid:{color:'rgba(255,255,255,.05)'},border:{display:false}},
          y2:{position:'right',ticks:{color:'#f59e0b',font:{size:10}},grid:{display:false},border:{display:false}}
        }
      }
    });
  } else {
    const n=(d.storeList||[]).length;
    wrap.style.height=Math.max(320,n*34+60)+'px';
    leg.innerHTML=mkLeg([['','ยอดขายตามสาขา (สีตามกลุ่ม)']]);
    const bgColors=(d.storeList||[]).map(s=>{const g=getGroup(s.name);return g?g.color+'99':'#8b949e88';});
    mainChart=new Chart($('mc'),{
      type:'bar',
      data:{
        labels:(d.storeList||[]).map(s=>s.name),
        datasets:[{
          label:'ยอดขาย',
          data:(d.storeList||[]).map(s=>s.rev),
          backgroundColor:bgColors,borderRadius:4,borderSkipped:'right',
          datalabels:{
            anchor:'end',align:'end',color:'#e6edf3',
            font:{size:10,family:"'JetBrains Mono',monospace"},
            formatter:v=>'฿'+fmtB(v)
          }
        }]
      },
      options:{
        indexAxis:'y',responsive:true,maintainAspectRatio:false,
        layout:{padding:{right:70}},
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:c=>'฿'+fmt(c.parsed.x)}},
          datalabels:{}
        },
        scales:{
          x:{ticks:{color:'#8b949e',font:{size:10},callback:v=>'฿'+fmtB(v)},grid:{color:'rgba(255,255,255,.05)'},border:{display:false}},
          y:{ticks:{color:'#8b949e',font:{size:11}},grid:{display:false}}
        }
      }
    });
  }
}

function mkLeg(items){return items.map(([c,l])=>`<div class="li">${c?`<span class="lsq" style="background:${c}"></span>`:''}<span>${l}</span></div>`).join('');}

// ── TABLE ────────────────────────────────────────────────────
function buildTable(list){
  const max=list[0]?.rev||1;
  $('stBody').innerHTML=list.map((s,i)=>{
    const pct=Math.round(s.rev/max*100);
    const avg=s.rec?Math.round(s.rev/s.rec):0;
    const g=getGroup(s.name);
    const badge=g?`<span class="grp-badge" style="background:${g.color}22;color:${g.color}">${g.name}</span>`:'';
    return `<tr>
      <td class="rank">${i+1}</td>
      <td><span class="sname">${s.name}</span>${badge}</td>
      <td style="font-size:11px;color:var(--muted)">${g?g.name:'—'}</td>
      <td class="r" style="font-family:var(--mono);font-size:12px">฿${fmt(s.rev)}</td>
      <td class="r" style="font-family:var(--mono);font-size:12px">${fmt(s.rec)}</td>
      <td class="r" style="font-family:var(--mono);font-size:12px">${fmt(s.items)}</td>
      <td class="r" style="font-family:var(--mono);font-size:12px">฿${fmt(avg)}</td>
      <td><div class="bw"><div class="bt"><div class="bf" style="width:${pct}%;background:${g?g.color:'#3b82f6'}"></div></div><span class="bpct">${pct}%</span></div></td>
    </tr>`;
  }).join('');
}

// ── TAB ──────────────────────────────────────────────────────
function switchTab(t,btn){
  curTab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  if(curData) buildMain(curData);
}

// ── FETCH ────────────────────────────────────────────────────
async function fetchData(){
  $('loader').classList.add('show');
  setStatus('','กำลังโหลด…'); hideErr();
  try{
    const res=await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(d.error) throw new Error(d.error);
    render(d); setStatus('live','เชื่อมต่อแล้ว');
  }catch(e){
    setStatus('err','เชื่อมต่อไม่ได้');
    showErr('ข้อผิดพลาด: '+e.message);
    loadDemo();
  }finally{$('loader').classList.remove('show');}
}

function setStatus(cls,txt){$('sdot').className='sdot'+(cls?' '+cls:'');$('stxt').textContent=txt;}
function showErr(m){const b=$('errBanner');b.textContent=m;b.classList.add('show');}
function hideErr(){$('errBanner').classList.remove('show');}

// ── DEMO ─────────────────────────────────────────────────────
function loadDemo(){
  hideErr(); setStatus('live','Demo mode');
  render({
    dateRange:'01/08/2026 – 06/08/2026',
    generated:'06/08/2026 14:30',
    net:2107362,orders:1131,avgPerOrder:1865,
    daily:{
